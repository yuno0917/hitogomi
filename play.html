<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b2a33">
<title>コントローラー｜この中にニンゲンがいる（仮）</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='8' y='17' width='16' height='13' rx='6' fill='%23ff4f4f'/%3E%3Ccircle cx='16' cy='10' r='7' fill='%235b4334'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/play.css">
</head>
<body class="role-wait">
<section id="joinView" class="view join">
  <h1>この中に<br><span>ニンゲン</span>がいる</h1>
  <label>部屋コード<input id="codeInput" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>
  <label>なまえ<input id="nameInput" maxlength="10" autocomplete="nickname"></label>
  <button id="joinBtn" type="button">参加する</button>
  <p id="joinMsg" class="msg"></p>
</section>

<section id="padView" class="view pad" hidden>
  <header class="top">
    <span class="me"><i id="meColor"></i><b id="meName"></b></span>
    <span id="status" class="status"></span>
    <button id="screenBtn" class="screen-btn" type="button">画面をかくす</button>
  </header>
  <div class="pad-body">
    <div id="screenBox" class="screen" hidden>
      <canvas id="screen"></canvas>
      <p id="screenNote" class="screen-note" hidden></p>
    </div>
    <div class="controls">
      <div class="role">
        <p id="roleTitle" class="title"></p>
        <p id="roleText" class="text"></p>
      </div>
      <div id="stickArea" class="stick-area" hidden>
        <div id="stickBase" class="stick-base"><div id="stickKnob" class="stick-knob"></div></div>
        <p id="stickHint" class="stick-hint"></p>
      </div>
      <button id="catchBtn" class="catch" type="button" hidden>つかまえる！</button>
      <footer id="infoBar" class="info"></footer>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="js/game.js"></script>
<script src="js/draw.js"></script>
<script src="js/play.js"></script>
</body>
</html>
